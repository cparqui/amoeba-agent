# E0.0 config. Copy to config.yaml (git-ignored) and edit.
#
# Each endpoint is one model. Give it either:
#   serve:    the pipeline starts a llama-server for it (free port, health check,
#             log in <run dir>/servers/), runs it, and stops it again; or
#   base_url: a server that is already running (hosted APIs, vLLM, a shared box).
#
# serve options: hf (repo[:quant], downloads on first run) or model_path (local GGUF),
# args (extra llama-server flags), bin (default $LLAMA_SERVER or llama-server),
# startup_timeout (s, default 900), env (e.g. CUDA_VISIBLE_DEVICES), port (default free).
#
# backend: llama_cpp | vllm | openai  (decides how a grammar is sent; see backends.py)

endpoints:
  - name: lfm2.5-350m
    serve: {hf: "lmstudio-community/LFM2.5-350M-GGUF:Q8_0"}
  - name: qwen3.5-0.8b
    serve: {hf: "unsloth/Qwen3.5-0.8B-GGUF:UD-Q4_K_XL"}
    extra:
      chat_template_kwargs: {enable_thinking: false}
  - name: gemma3-1b
    serve: {hf: "ggml-org/gemma-3-1b-it-GGUF:Q4_K_M"}
  - name: lfm2.5-2.6b
    serve:
      hf: "LiquidAI/LFM2.5-2.6B-GGUF:Q4_K_M"
      # args: ["-ngl", "99", "-c", "4096"]   # GPU offload, context size
  # Inkling 2 Mini (Thinking Machines): looped MoE, 26.4B total / 3.4B active
  # (5.4B effective: the middle layers run 3 times). Much larger than the others:
  # IQ4_NL is 17.6 GB. Needs a llama.cpp build with the inkling2 architecture.
  - name: inkling2-mini
    serve:
      hf: "ggml-org/Inkling-2-Mini-GGUF:IQ4_NL"
      # -c: the model advertises a 1M context; cap it so the KV cache (one per
      # loop pass) fits. --no-mmproj: skip the vision encoder, E0.0 is text only.
      args: ["-c", "8192", "--no-mmproj"]
    extra:
      # Reasoning can't be fully disabled ("none" still reasons a little), so
      # keep it minimal and give it more room than the global max_tokens.
      chat_template_kwargs: {reasoning_effort: none}
      max_tokens: 1024

  # Ceiling: any hosted OpenAI-compatible model. Free decoding only.
  # - name: ceiling
  #   base_url: https://api.example.com/v1
  #   model: some-large-model
  #   backend: openai
  #   api_key_env: CEILING_API_KEY

  # Example vLLM endpoint (older vLLM: grammar_field: guided_grammar)
  # - name: qwen3.5-0.8b-vllm
  #   base_url: http://127.0.0.1:8000/v1
  #   model: Qwen/Qwen3.5-0.8B
  #   backend: vllm

# Endpoints to translate with (default: all except the judge).
# models: [lfm2.5-350m, qwen3.5-0.8b]

# Endpoint that answers fidelity questions. Use your strongest model.
judge: lfm2.5-2.6b
judge_repeats: [0]    # which repeats the judge scores; more = tighter fidelity estimate

syntaxes: [sexpr, prolog, json]
lexicon_modes: [empty, seeded, evolving]   # also: seeded_evolving
decoding: [free, constrained]
repeats: 3
temperature: 0.7      # > 0 so stability across repeats means something
seed: 1234            # repeat r samples with seed + r; remove for unseeded runs
max_tokens: 300
lexicon_cap: 150      # most recent symbols shown to the perceiver

# A few starting predicates for the seeded modes. Everything else is learned.
seed_lexicon: [self, at_time, at_position, has_property, part_of, moved, sees, touches]

# MLflow tracking: on by default and required. Set uri here or $MLFLOW_TRACKING_URI;
# the pipeline stops before starting anything if neither is set or the server is
# down. `pipeline --no-track` skips it for one run; `track <run dir>` uploads later.
tracking:
  # uri: http://workstation:5000
  experiment: e0.0-translation
