[project]
name = "amoeba-environments"
version = "0.0.1"
description = "Test, training and evaluation environments that embody Amoeba cells."
requires-python = ">=3.11"
dependencies = ["amoeba-agent"]

[tool.uv.sources]
amoeba-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amoeba_environments"]
