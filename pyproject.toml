[project]
name = "amoeba-agent"
version = "0.0.1"
description = "A minimal single-cell agent harness built on a perceive-model-decide-act loop."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
amoeba = "amoeba.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]
# MLflow tracking client for experiments (the server runs elsewhere), plus
# psutil / nvidia-ml-py for its system metrics (CPU, memory, NVIDIA GPU).
experiments = ["mlflow-skinny>=3.0", "python-dotenv>=1.0", "psutil>=5.9", "nvidia-ml-py>=12.0"]

[tool.uv]
default-groups = ["dev", "experiments"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amoeba"]

[tool.uv.workspace]
members = ["environments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["dotenv: test loads .env files for real (skips the autouse guard)"]
